[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-trajectory-prediction"
version = "0.2.0"
description = "A planar multistage rocket ascent simulator and trajectory analysis toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
rocket-sim = "rocket_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rocket_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
