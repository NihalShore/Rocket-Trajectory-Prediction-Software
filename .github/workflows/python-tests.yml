name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -e ".[test,plot]"
      - run: .venv/bin/pytest tests/ -q
      - run: .venv/bin/python main.py
      - run: .venv/bin/python main.py --vehicle small --step 0.05 --stop-apogee
      - name: Run module CLI without a display
        env:
          MPLBACKEND: Agg
        run: .venv/bin/python -m rocket_sim.cli --plot
      - run: for example in examples/*.py; do .venv/bin/python "$example"; done
